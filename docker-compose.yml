services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: holyapp
      POSTGRES_PASSWORD: holyapp_dev
      POSTGRES_DB: holyapp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file: ./server/.env
    depends_on:
      - postgres
    volumes:
      - ./server:/app
      - /app/node_modules

  # client:
  #   build: ./client
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - server
  #   volumes:
  #     - ./client:/app
  #     - /app/node_modules

volumes:
  pgdata: